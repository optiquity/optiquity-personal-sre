# systemd drop-in — makes Gatus load the SMTP credential env for its email alerter.
# Non-destructive: it augments the gatus unit without editing it. Install with:
#   sudo mkdir -p /etc/systemd/system/gatus.service.d
#   sudo install -m 644 gatus-smtp.dropin.conf /etc/systemd/system/gatus.service.d/10-smtp-env.conf
#   sudo systemctl daemon-reload && sudo systemctl restart gatus
# (systemd reads EnvironmentFile as root at unit-load, so /etc/gatus/gatus.env can be root:600.)
#
# If you run Gatus another way (a timer, a container, launchd), load the same two vars into its
# environment however that runtime does it — the mechanism differs, the credential is the same.
[Service]
EnvironmentFile=/etc/gatus/gatus.env
